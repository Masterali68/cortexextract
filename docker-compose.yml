services:
  redis:
    image: redis:7-alpine
    container_name: cortexextract-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: cortexextract-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: cortexextract-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgvector:5432/postgres
      REDIS_URL: redis://redis:6379/0
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      DEV_ORIGINS: ${DEV_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data: